<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stitch &amp; Style</title>
<meta name="description" content="Run a little dress boutique: design dresses for your customers, sew them, and grow your shop.">
<meta name="theme-color" content="#fbf0ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stitch &amp; Style">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #fbf0ec;
    --panel: #ffffff;
    --ink: #3b2a33;
    --muted: #8a7480;
    --line: #ecd9d6;
    --accent: #c2456b;
    --accent-2: #f3c6d3;
    --good: #3f9b6b;
    --bad: #c8463e;
    --gold: #e0a92e;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #app {
    height: 100%;
    max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 12px 16px 16px; gap: 12px; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; margin: 0; font-weight: 700; }
  button {
    font: inherit; border: 0; cursor: pointer; color: inherit;
    border-radius: 14px; padding: 14px 18px; background: var(--panel);
    box-shadow: 0 1px 0 var(--line), 0 2px 8px rgba(120, 60, 80, .08);
    transition: transform .08s ease;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #fff; font-weight: 700; font-size: 18px; box-shadow: 0 4px 14px rgba(194, 69, 107, .35); }
  button.ghost { background: transparent; box-shadow: none; color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .45; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 16px; box-shadow: 0 2px 12px rgba(120, 60, 80, .08); }
  .muted { color: var(--muted); }
  .center { text-align: center; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .pill { background: var(--panel); border-radius: 999px; padding: 6px 12px; box-shadow: 0 1px 6px rgba(120, 60, 80, .1); white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .icon-btn { padding: 8px 12px; border-radius: 999px; font-size: 15px; font-weight: 700; }

  /* Title */
  .title-screen { justify-content: center; align-items: center; text-align: center; }
  .logo { font-family: Georgia, serif; font-size: 52px; line-height: .95; color: var(--accent); letter-spacing: -1px; }
  .logo small { display: block; font-size: 15px; letter-spacing: 3px; color: var(--muted); margin-top: 10px; font-family: -apple-system, sans-serif; text-transform: uppercase; }
  .title-dress { width: 170px; height: 260px; }
  .title-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }

  /* Customer */
  .customer { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 1; justify-content: center; }
  .avatar { font-size: 84px; line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.12)); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .bubble { position: relative; background: var(--panel); border-radius: 20px; padding: 16px 18px; font-size: 17px; line-height: 1.4; box-shadow: 0 4px 16px rgba(120, 60, 80, .1); }
  .bubble::before { content: ""; position: absolute; top: -10px; left: 50%; margin-left: -10px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--panel); }
  .event-tag { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-2); padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
  .wants { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .want { background: var(--panel); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; box-shadow: 0 1px 6px rgba(120, 60, 80, .1); }
  .want.love { color: #b8336a; } .want.must { color: var(--good); } .want.hate { color: var(--bad); }

  /* Studio */
  .studio { padding-bottom: 12px; }
  .req-strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  .req-strip::-webkit-scrollbar { display: none; }
  .req-strip .want { font-size: 12px; padding: 6px 10px; white-space: nowrap; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .stage svg { height: 100%; max-height: 360px; width: auto; }
  .stage .spot { position: absolute; bottom: 4%; width: 60%; height: 18px; border-radius: 50%; background: radial-gradient(rgba(120,60,80,.18), transparent 70%); }
  .panel { background: var(--panel); border-radius: 22px; padding: 10px; box-shadow: 0 -2px 16px rgba(120, 60, 80, .08); flex-shrink: 0; }
  .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin-bottom: 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 2px; font-size: 12px; font-weight: 700; border-radius: 10px; box-shadow: none; background: transparent; color: var(--muted); }
  .tab.on { background: var(--accent-2); color: var(--accent); }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; min-height: 104px; align-content: start; }
  .opt { padding: 10px 6px; font-size: 13px; font-weight: 600; border-radius: 12px; background: #fdf7f5; box-shadow: inset 0 0 0 1.5px var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
  .opt.on { box-shadow: inset 0 0 0 2.5px var(--accent); background: #fff; color: var(--accent); }
  .opt.locked { opacity: .5; }
  .opt .lock { position: absolute; top: 4px; right: 6px; font-size: 11px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); overflow: hidden; }
  .swatch svg { width: 100%; height: 100%; display: block; }
  .studio-actions { display: flex; gap: 8px; margin-top: 10px; }

  /* Sewing */
  .sew { justify-content: center; align-items: center; text-align: center; }
  .sew-zone { width: 100%; padding: 28px 0; }
  .track { position: relative; height: 56px; border-radius: 14px; background: repeating-linear-gradient(90deg, #f5e6e2 0 10px, #f0dcd7 10px 20px); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
  .zone { position: absolute; top: 0; bottom: 0; background: rgba(63, 155, 107, .28); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
  .zone .perfect { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 30%; background: rgba(63, 155, 107, .45); }
  .needle { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 0 2px #fff; }
  .needle::before { content: ""; position: absolute; top: 6px; left: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .stitches { display: flex; gap: 14px; justify-content: center; margin: 22px 0 8px; }
  .stitch { width: 30px; height: 8px; border-radius: 4px; background: var(--line); transition: background .2s; }
  .stitch.perfect { background: var(--good); } .stitch.good { background: #8cc4a4; } .stitch.miss { background: var(--bad); }
  .sew-msg { height: 28px; font-weight: 800; font-size: 22px; }
  .sew-msg.perfect { color: var(--good); } .sew-msg.good { color: #5a9d78; } .sew-msg.miss { color: var(--bad); }
  .sew-tap { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; }

  /* Result */
  .result { align-items: center; text-align: center; overflow-y: auto; }
  .result-top { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
  .result-top svg { width: 130px; height: 210px; }
  .result-top .avatar { font-size: 64px; animation: none; }
  .stars { font-size: 34px; letter-spacing: 4px; color: var(--gold); }
  .stars .off { color: #e8d9d4; }
  .feedback { list-style: none; padding: 0; margin: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .feedback li { background: var(--panel); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .feedback li.pos::before { content: "✓ "; color: var(--good); font-weight: 800; }
  .feedback li.neg::before { content: "✗ "; color: var(--bad); font-weight: 800; }
  .pay { font-size: 28px; font-weight: 800; color: var(--good); }

  /* Store */
  .store { overflow-y: auto; }
  .store h3 { font-size: 18px; margin: 6px 0 2px; }
  .store-item { display: flex; align-items: center; gap: 12px; background: var(--panel); border-radius: 14px; padding: 10px 12px; }
  .store-item .name { flex: 1; font-weight: 600; }
  .store-item button { padding: 8px 14px; font-size: 14px; font-weight: 700; background: var(--accent); color: #fff; }
  .store-item .owned { color: var(--good); font-weight: 700; font-size: 14px; }
  .store-list { display: flex; flex-direction: column; gap: 8px; }

  /* Overlay */
  .overlay { position: fixed; inset: 0; background: rgba(59, 42, 51, .45); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 10; animation: fade .2s; }
  .overlay .card { max-width: 400px; max-height: 80vh; overflow-y: auto; }
  .overlay p, .overlay li { line-height: 1.45; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 20; animation: fade .2s; max-width: 90%; text-align: center; }
  .summary-big { font-size: 40px; font-weight: 800; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';

  // ---------- Data ----------
  const COLORS = {
    rose:     { name: 'Rose',     hex: '#e8879c', price: 0 },
    crimson:  { name: 'Crimson',  hex: '#b3203a', price: 0 },
    ivory:    { name: 'Ivory',    hex: '#f4ecd8', price: 0, light: true },
    black:    { name: 'Black',    hex: '#2b2730', price: 0 },
    navy:     { name: 'Navy',     hex: '#28366e', price: 0 },
    sky:      { name: 'Sky',      hex: '#8cc6ea', price: 25, light: true },
    coral:    { name: 'Coral',    hex: '#f28b6b', price: 25 },
    lavender: { name: 'Lavender', hex: '#b9a3e3', price: 25, light: true },
    emerald:  { name: 'Emerald',  hex: '#1f8a5c', price: 40 },
    gold:     { name: 'Gold',     hex: '#d9a93a', price: 50 },
  };

  const CATS = [
    { key: 'sil', label: 'Style', items: {
      aline:    { name: 'A-Line',    price: 0,  phrase: 'an A-line cut' },
      sheath:   { name: 'Sheath',    price: 0,  phrase: 'a sleek sheath' },
      ballgown: { name: 'Ball Gown', price: 60, phrase: 'a ball gown' },
      mermaid:  { name: 'Mermaid',   price: 80, phrase: 'a mermaid cut' },
    }},
    { key: 'len', label: 'Length', items: {
      mini:  { name: 'Mini',  price: 0, phrase: 'a mini length', y: 180 },
      knee:  { name: 'Knee',  price: 0, phrase: 'a knee length', y: 215 },
      midi:  { name: 'Midi',  price: 0, phrase: 'a midi length', y: 255 },
      floor: { name: 'Floor', price: 0, phrase: 'a floor length', y: 300 },
    }},
    { key: 'sleeve', label: 'Sleeves', items: {
      none: { name: 'None', price: 0,  phrase: 'no sleeves' },
      cap:  { name: 'Cap',  price: 0,  phrase: 'cap sleeves' },
      puff: { name: 'Puff', price: 20, phrase: 'puff sleeves' },
      long: { name: 'Long', price: 0,  phrase: 'long sleeves' },
    }},
    { key: 'col', label: 'Color', items: COLORS },
    { key: 'pat', label: 'Pattern', items: {
      solid:   { name: 'Solid',   price: 0,  phrase: 'a solid fabric' },
      polka:   { name: 'Polka',   price: 30, phrase: 'polka dots' },
      stripes: { name: 'Stripes', price: 30, phrase: 'stripes' },
      floral:  { name: 'Floral',  price: 50, phrase: 'florals' },
      sparkle: { name: 'Sparkle', price: 70, phrase: 'sparkle' },
    }},
    { key: 'trim', label: 'Trim', items: {
      none:   { name: 'None',     price: 0,  phrase: 'no trim' },
      sash:   { name: 'Sash',     price: 0,  phrase: 'a sash' },
      bow:    { name: 'Bow',      price: 20, phrase: 'a bow' },
      lace:   { name: 'Lace Hem', price: 40, phrase: 'a lace hem' },
      pearls: { name: 'Pearls',   price: 60, phrase: 'pearls' },
    }},
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.key, c]));
  const item = (cat, id) => CAT[cat].items[id];

  const EVENTS = [
    { id: 'picnic', name: 'Garden Picnic', rep: 0, base: 40,
      line: 'something breezy for a sunny afternoon',
      len: ['mini', 'knee'], sil: ['aline'], sleeve: ['cap', 'puff', 'none'], pat: ['floral', 'polka'],
      col: ['sky', 'coral', 'lavender', 'rose'], trim: ['bow', 'sash'] },
    { id: 'beach', name: 'Beach Party', rep: 0, base: 40,
      line: 'something light I can dance in on the sand',
      len: ['mini', 'knee'], sil: ['aline', 'sheath'], sleeve: ['none'], pat: ['stripes', 'solid', 'polka'],
      col: ['sky', 'coral', 'ivory'], trim: ['none', 'sash'] },
    { id: 'office', name: 'Office Party', rep: 0, base: 50,
      line: 'something polished, but still fun',
      len: ['knee', 'midi'], sil: ['sheath'], sleeve: ['cap', 'long'], pat: ['solid', 'stripes'],
      col: ['navy', 'black', 'crimson'], trim: ['sash', 'none'] },
    { id: 'wedguest', name: 'Wedding Guest', rep: 5, base: 65,
      line: "something elegant, but I can't upstage the bride",
      len: ['midi', 'floor'], sil: ['aline', 'sheath'], sleeve: ['cap', 'puff', 'long'], pat: ['floral', 'solid'],
      col: ['rose', 'lavender', 'sky', 'emerald'], trim: ['sash', 'bow'], banned: ['ivory'] },
    { id: 'prom', name: 'Prom Night', rep: 12, base: 75,
      line: 'a dress everyone will remember',
      len: ['floor', 'mini'], sil: ['ballgown', 'aline'], sleeve: ['none', 'puff'], pat: ['sparkle', 'solid'],
      col: ['crimson', 'lavender', 'gold', 'sky', 'rose'], trim: ['bow', 'pearls'] },
    { id: 'gala', name: 'Winter Gala', rep: 20, base: 95,
      line: 'pure old-Hollywood glamour',
      len: ['floor'], sil: ['mermaid', 'ballgown', 'sheath'], sleeve: ['none', 'long'], pat: ['sparkle', 'solid'],
      col: ['black', 'gold', 'emerald', 'crimson', 'navy'], trim: ['pearls', 'none'] },
    { id: 'bride', name: 'My Wedding Day', rep: 32, base: 160,
      line: 'THE dress. No pressure!',
      len: ['floor'], sil: ['ballgown', 'mermaid', 'aline'], sleeve: ['none', 'cap', 'long'], pat: ['solid', 'floral'],
      col: ['ivory'], trim: ['lace', 'pearls'] },
  ];

  const NAMES = ['Amelia', 'Bea', 'Clara', 'Daisy', 'Elena', 'Fiona', 'Grace', 'Hana', 'Iris', 'Jade', 'Kiki', 'Lena',
    'Maya', 'Nora', 'Olive', 'Priya', 'Quinn', 'Rosa', 'Sofia', 'Tess', 'Uma', 'Vera', 'Willow', 'Yara', 'Zoe',
    'Mei', 'Aisha', 'Lucia', 'Ingrid', 'Noor'];
  const AVATARS = ['👩', '👩🏻', '👩🏼', '👩🏽', '👩🏾', '👩🏿', '👱‍♀️', '👱🏽‍♀️', '👩‍🦰', '👩🏻‍🦰', '👩‍🦱', '👩🏾‍🦱', '👩🏿‍🦱', '👩🏼‍🦳', '👵🏻', '👵🏽', '🧕🏽', '🧕🏾', '👸🏼', '👸🏾'];
  const CUSTOMERS_PER_DAY = 3;

  // ---------- State ----------
  const SAVE_KEY = 'stitchStyle.v1';
  const freshState = () => ({ money: 30, rep: 0, day: 1, served: 0, todayIdx: 0, todayMoney: 0, todayStars: 0, owned: [], customer: null, best: 0 });
  let S = freshState();
  const isOwned = (cat, id) => item(cat, id).price === 0 || S.owned.includes(cat + ':' + id);

  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
  function load() {
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return Object.assign(freshState(), JSON.parse(raw)); } catch (e) { /* ignore */ }
    return null;
  }

  // ---------- Helpers ----------
  const $app = document.getElementById('app');
  const rand = n => Math.floor(Math.random() * n);
  const pick = arr => arr[rand(arr.length)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let uidCounter = 0;

  let audioCtx = null;
  function beep(freq = 660, dur = 0.08, type = 'sine', vol = 0.08) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* audio unavailable */ }
  }

  function toast(msg) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function overlay(html, onClose) {
    const o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML = `<div class="card">${html}<button class="primary" style="width:100%;margin-top:14px" data-close>Got it</button></div>`;
    o.addEventListener('click', e => { if (e.target === o || e.target.hasAttribute('data-close')) { o.remove(); onClose && onClose(); } });
    document.body.appendChild(o);
  }

  // ---------- Dress drawing ----------
  function patternDef(pat, color, accent, id) {
    const bg = `<rect width="100%" height="100%" fill="${color}"/>`;
    switch (pat) {
      case 'polka': return `<pattern id="${id}" width="14" height="14" patternUnits="userSpaceOnUse">${bg}
        <circle cx="3.5" cy="3.5" r="2.3" fill="${accent}"/><circle cx="10.5" cy="10.5" r="2.3" fill="${accent}"/></pattern>`;
      case 'stripes': return `<pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse">${bg}
        <rect width="4" height="10" fill="${accent}"/></pattern>`;
      case 'floral': {
        const flower = (x, y, r) => [0, 72, 144, 216, 288].map(a => {
          const rad = a * Math.PI / 180;
          return `<circle cx="${(x + Math.cos(rad) * r * 1.1).toFixed(2)}" cy="${(y + Math.sin(rad) * r * 1.1).toFixed(2)}" r="${r}" fill="${accent}"/>`;
        }).join('') + `<circle cx="${x}" cy="${y}" r="${r * .8}" fill="#f6d36b"/>`;
        return `<pattern id="${id}" width="26" height="26" patternUnits="userSpaceOnUse">${bg}${flower(7, 7, 2.2)}${flower(19.5, 19.5, 1.6)}
          <path d="M14 4 q3 2 1 5" stroke="${accent}" stroke-width="1" fill="none" opacity=".7"/></pattern>`;
      }
      case 'sparkle': {
        const star = (x, y, s) => `<path d="M${x} ${y - s} Q${x} ${y} ${x + s} ${y} Q${x} ${y} ${x} ${y + s} Q${x} ${y} ${x - s} ${y} Q${x} ${y} ${x} ${y - s}Z" fill="#fff" opacity=".9"/>`;
        return `<pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse">${bg}${star(5, 5, 3)}${star(13.5, 12.5, 2.2)}
          <circle cx="14" cy="3" r=".8" fill="#fff" opacity=".8"/><circle cx="3" cy="14" r=".7" fill="#fff" opacity=".7"/></pattern>`;
      }
      default: return '';
    }
  }

  function skirtShape(sil, hem) {
    let d, hw;
    switch (sil) {
      case 'sheath':
        hw = 27;
        d = `M80 135 C76 150 72 165 73 180 L${100 - hw} ${hem} Q100 ${hem + 3} ${100 + hw} ${hem} L127 180 C128 165 124 150 120 135Z`;
        break;
      case 'ballgown':
        hw = 32 + (hem - 135) * 0.62;
        d = `M80 135 C58 142 ${100 - hw} ${hem - 40} ${100 - hw} ${hem} Q100 ${hem + 12} ${100 + hw} ${hem} C${100 + hw} ${hem - 40} 142 142 120 135Z`;
        break;
      case 'mermaid': {
        const knee = hem - Math.max(24, (hem - 135) * 0.32);
        hw = 30 + (hem - knee) * 0.55;
        d = `M80 135 C72 152 73 ${knee - 25} 77 ${knee} Q76 ${hem - 8} ${100 - hw} ${hem} Q100 ${hem + 7} ${100 + hw} ${hem} Q124 ${hem - 8} 123 ${knee} C127 ${knee - 25} 128 152 120 135Z`;
        break;
      }
      default: // aline
        hw = 24 + (hem - 135) * 0.4;
        d = `M80 135 L${100 - hw} ${hem} Q100 ${hem + 7} ${100 + hw} ${hem} L120 135Z`;
    }
    return { d, hw };
  }

  function dressSVG(d, cls = '') {
    const uid = ++uidCounter;
    const c = COLORS[d.col];
    const accent = c.light ? '#b0874a' : 'rgba(255,255,255,0.72)';
    const pid = 'pat' + uid, gid = 'shade' + uid;
    const fill = d.pat === 'solid' ? c.hex : `url(#${pid})`;
    const hem = item('len', d.len).y;
    const skirt = skirtShape(d.sil, hem);
    const stroke = 'stroke="rgba(40,20,30,.22)" stroke-width="1.2" stroke-linejoin="round"';
    const trimColor = c.light ? '#c2456b' : '#fbf3e6';
    const bodice = 'M70 78 Q70 70 78 68 L91 65 Q100 82 109 65 L122 68 Q130 70 130 78 L124 110 Q120 125 120 135 L80 135 Q80 125 76 110Z';

    let sleevesBack = '', sleevesFront = '';
    const mirror = s => s + `<g transform="translate(200 0) scale(-1 1)">${s}</g>`;
    if (d.sleeve === 'long') sleevesBack = mirror(`<path d="M76 69 Q66 70 61 80 L50 150 Q55 155 61 152 L74 98Z" fill="${fill}" ${stroke}/>`);
    if (d.sleeve === 'cap') sleevesFront = mirror(`<path d="M80 67 Q66 66 60 82 Q68 88 75 84Z" fill="${fill}" ${stroke}/>`);
    if (d.sleeve === 'puff') sleevesFront = mirror(`<path d="M82 67 Q62 58 56 78 Q56 92 70 92 Q76 88 76 82Z" fill="${fill}" ${stroke}/><path d="M60 84 Q66 90 72 88" stroke="${accent}" stroke-width="1" fill="none" opacity=".6"/>`);

    let trim = '';
    if (d.trim === 'sash' || d.trim === 'bow') trim += `<rect x="78" y="128" width="44" height="10" rx="3" fill="${trimColor}" ${stroke}/>`;
    if (d.trim === 'bow') trim += `<path d="M100 133 L84 123 Q80 133 84 143Z M100 133 L116 123 Q120 133 116 143Z" fill="${trimColor}" ${stroke}/>
      <path d="M98 136 L92 156 L97 154 Z M102 136 L108 156 L103 154Z" fill="${trimColor}" ${stroke}/><circle cx="100" cy="133" r="4" fill="${trimColor}" ${stroke}/>`;
    if (d.trim === 'lace') {
      const n = Math.max(6, Math.round(skirt.hw * 2 / 7));
      let s = '';
      for (let i = 0; i <= n; i++) {
        const x = 100 - skirt.hw + (skirt.hw * 2) * i / n;
        const t = (x - 100) / skirt.hw;
        const y = hem + (1 - t * t) * (d.sil === 'ballgown' ? 6 : 3);
        s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="#fffaf0" stroke="#d9ccb4" stroke-width=".8"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.4" fill="#e8dcc4"/>`;
      }
      trim += s;
    }
    if (d.trim === 'pearls') {
      let s = '';
      for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        const x = (1 - t) * (1 - t) * 88 + 2 * (1 - t) * t * 100 + t * t * 112;
        const y = (1 - t) * (1 - t) * 64 + 2 * (1 - t) * t * 92 + t * t * 64;
        s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#fffdf6" stroke="#cfc3aa" stroke-width=".7"/>`;
      }
      trim += s;
    }

    return `<svg class="${cls}" viewBox="0 0 200 340" xmlns="http://www.w3.org/2000/svg" aria-label="Dress design">
      <defs>${patternDef(d.pat, c.hex, accent, pid)}
        <linearGradient id="${gid}" x1="0" x2="1">
          <stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity=".14"/>
          <stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/>
        </linearGradient>
      </defs>
      <rect x="97" y="150" width="6" height="175" fill="#8b6b55"/>
      <path d="M70 330 Q100 318 130 330 Z" fill="#8b6b55"/>
      <rect x="93" y="40" width="14" height="28" rx="5" fill="#e6d6be"/>
      <ellipse cx="100" cy="40" rx="11" ry="6" fill="#8b6b55"/>
      <path d="M72 76 Q100 62 128 76 L124 112 Q118 130 126 175 L74 175 Q82 130 76 112Z" fill="#e9dcc7" ${stroke}/>
      ${sleevesBack}
      <path d="${skirt.d}" fill="${fill}" ${stroke}/>
      <path d="${skirt.d}" fill="url(#${gid})"/>
      <path d="${bodice}" fill="${fill}" ${stroke}/>
      <path d="${bodice}" fill="url(#${gid})"/>
      <path d="M80 135 L120 135" stroke="rgba(40,20,30,.25)" stroke-width="1"/>
      ${sleevesFront}
      ${trim}
    </svg>`;
  }

  function swatchSVG(pat, colorKey = 'rose') {
    const c = COLORS[colorKey];
    const accent = c.light ? '#b0874a' : 'rgba(255,255,255,0.72)';
    const id = 'sw' + (++uidCounter);
    const fill = pat === 'solid' ? c.hex : `url(#${id})`;
    return `<svg viewBox="0 0 26 26"><defs>${patternDef(pat, c.hex, accent, id)}</defs><rect width="26" height="26" fill="${fill}"/></svg>`;
  }

  // ---------- Customers & scoring ----------
  function availableEvents() { return EVENTS.filter(e => S.rep >= e.rep); }

  function newCustomer() {
    const evs = availableEvents();
    // Newer events show up a bit more often once unlocked.
    const weighted = evs.flatMap((e, i) => Array(1 + Math.floor(i / 2)).fill(e));
    const ev = pick(weighted);

    const ownedCols = ev.col.filter(k => isOwned('col', k));
    const fav = (ownedCols.length && Math.random() < 0.7) ? pick(ownedCols) : pick(ev.col);

    const wishPool = [];
    ['sil', 'sleeve', 'pat', 'trim'].forEach(cat => ev[cat].forEach(id => {
      if (id !== 'none' && id !== 'solid') wishPool.push({ cat, id });
    }));
    const ownedWish = wishPool.filter(w => isOwned(w.cat, w.id));
    const wish = (ownedWish.length && Math.random() < 0.75) ? pick(ownedWish) : pick(wishPool);

    const hatePool = [];
    ['sleeve', 'pat', 'trim', 'sil'].forEach(cat => Object.keys(CAT[cat].items).forEach(id => {
      if (id === 'none' || id === 'solid' || ev[cat].includes(id)) return;
      if (cat === 'sil' && ev.sil.length < 2) return;
      hatePool.push({ cat, id });
    }));
    const hate = hatePool.length ? pick(hatePool) : null;

    return {
      ev: ev.id, name: pick(NAMES), avatar: pick(AVATARS), fav, wish, hate,
      design: { sil: 'aline', len: 'knee', sleeve: 'none', col: 'rose', pat: 'solid', trim: 'none' },
    };
  }

  function evaluate(cu, d) {
    const ev = EVENTS.find(e => e.id === cu.ev);
    let score = 0;
    const pos = [], neg = [];
    const MAX = 13;

    if (ev.banned && ev.banned.includes(d.col)) { score -= 3; neg.push(`${COLORS[d.col].name}?! That's a big no for a ${ev.name.toLowerCase()}.`); }
    else if (d.col === cu.fav) { score += 3; pos.push(`${COLORS[d.col].name} — my favorite color!`); }
    else if (ev.col.includes(d.col)) { score += 1; pos.push(`${COLORS[d.col].name} works, though I did say I love ${COLORS[cu.fav].name.toLowerCase()}.`); }
    else neg.push(`I was really hoping for ${COLORS[cu.fav].name.toLowerCase()}.`);

    if (ev.len.includes(d.len)) { score += 2; pos.push('The length is perfect.'); }
    else {
      const order = ['mini', 'knee', 'midi', 'floor'];
      const tooShort = order.indexOf(d.len) < order.indexOf(ev.len[0]);
      neg.push(`It's a bit too ${tooShort ? 'short' : 'long'} for a ${ev.name.toLowerCase()}.`);
    }

    if (ev.sil.includes(d.sil)) { score += 2; pos.push(`The ${item('sil', d.sil).name.toLowerCase()} shape suits the occasion.`); }
    else neg.push(`A ${item('sil', d.sil).name.toLowerCase()} doesn't feel right for this event.`);

    if (ev.sleeve.includes(d.sleeve)) { score += 1; }
    else neg.push(d.sleeve === 'none' ? "I'd feel better with some sleeves." : `${item('sleeve', d.sleeve).name} sleeves feel off for this.`);

    if (ev.pat.includes(d.pat)) { score += 1; if (d.pat !== 'solid') pos.push(`Love the ${item('pat', d.pat).name.toLowerCase()} fabric!`); }
    else neg.push(`${item('pat', d.pat).name} fabric isn't quite the vibe.`);

    if (ev.trim.includes(d.trim)) { score += 1; if (d.trim !== 'none') pos.push(`The ${item('trim', d.trim).name.toLowerCase()} is a lovely touch.`); }
    else if (d.trim === 'none') neg.push('It feels a little plain.');
    else neg.push(`The ${item('trim', d.trim).name.toLowerCase()} is a bit much for this.`);

    if (d[cu.wish.cat] === cu.wish.id) { score += 3; pos.unshift(`You remembered ${item(cu.wish.cat, cu.wish.id).phrase}!`); }
    else { score -= 1; neg.unshift(`I specifically asked for ${item(cu.wish.cat, cu.wish.id).phrase}!`); }

    if (cu.hate && d[cu.hate.cat] === cu.hate.id) { score -= 4; neg.unshift(`Ugh, ${item(cu.hate.cat, cu.hate.id).phrase}. I told you I can't stand those.`); }

    return { pct: Math.max(0, Math.min(1, score / MAX)), pos, neg, ev };
  }

  function showSewing() {
    const STITCHES = 5;
    const speed = Math.min(1.9, 0.75 + S.day * 0.07); // track widths per second
    const zoneW = Math.max(0.16, 0.3 - S.day * 0.012);
    let results = [], pos = 0, dir = 1, last = performance.now(), raf = 0, zoneL = 0, locked = false;

    $app.innerHTML = `<div class="screen sew">
      ${topbar()}
      <h2>Sew the seam</h2>
      <p class="muted" style="margin:0">Tap anywhere when the needle is in the green!</p>
      <div class="sew-tap" id="tap">
        <div class="sew-zone">
          <div class="track"><div class="zone" id="zone"><div class="perfect"></div></div><div class="needle" id="needle"></div></div>
          <div class="stitches">${Array.from({ length: STITCHES }, () => '<div class="stitch"></div>').join('')}</div>
          <div class="sew-msg" id="msg"></div>
        </div>
      </div>
    </div>`;
    const zone = document.getElementById('zone'), needle = document.getElementById('needle'), msg = document.getElementById('msg');
    const placeZone = () => { zoneL = 0.05 + Math.random() * (0.9 - zoneW); zone.style.left = (zoneL * 100) + '%'; zone.style.width = (zoneW * 100) + '%'; };
    placeZone();

    const loop = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      pos += dir * speed * dt;
      if (pos > 1) { pos = 1; dir = -1; } else if (pos < 0) { pos = 0; dir = 1; }
      needle.style.left = (pos * 100) + '%';
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    document.getElementById('tap').addEventListener('pointerdown', e => {
      e.preventDefault();
      if (locked || results.length >= STITCHES) return;
      const center = zoneL + zoneW / 2;
      const off = Math.abs(pos - center);
      let r;
      if (off <= zoneW * 0.15) r = 'perfect';
      else if (off <= zoneW / 2) r = 'good';
      else r = 'miss';
      results.push(r);
      const el = $app.querySelectorAll('.stitch')[results.length - 1];
      el.classList.add(r);
      msg.className = 'sew-msg ' + r;
      msg.textContent = r === 'perfect' ? 'Perfect!' : r === 'good' ? 'Nice!' : 'Oops!';
      beep(r === 'perfect' ? 1046 : r === 'good' ? 784 : 220, 0.1, r === 'miss' ? 'square' : 'sine');
      if (results.length >= STITCHES) {
        locked = true;
        setTimeout(() => { cancelAnimationFrame(raf); finishCustomer(results); }, 650);
      } else {
        locked = true;
        setTimeout(() => { placeZone(); locked = false; }, 260);
      }
    });
  }

  function finishCustomer(stitches) {
    const cu = S.customer;
    const q = stitches.reduce((a, r) => a + (r === 'perfect' ? 1 : r === 'good' ? 0.7 : 0.15), 0) / stitches.length;
    const res = evaluate(cu, cu.design);
    const total = res.pct * 0.75 + q * 0.25;
    const stars = Math.max(1, Math.min(5, Math.round(total * 5)));
    let pay = Math.round(res.ev.base * (0.25 + 0.75 * total));
    const tip = stars === 5 ? Math.round(res.ev.base * 0.3) : 0;
    pay += tip;

    const prevEvents = availableEvents().length;
    S.money += pay; S.rep += stars; S.served += 1; S.todayIdx += 1; S.todayMoney += pay; S.todayStars += stars;
    S.best = Math.max(S.best, pay);
    const design = cu.design;
    S.customer = null;
    save();
    const unlocked = EVENTS.filter(e => e.rep <= S.rep).slice(prevEvents);

    const reaction = stars >= 5 ? "I'm in LOVE! This is everything!" : stars === 4 ? 'This is gorgeous, thank you!' : stars === 3 ? "It's nice. Not quite what I pictured, but nice." : stars === 2 ? "Hmm… I guess I'll wear it." : 'Is this… a joke?';
    const seamNote = q >= 0.9 ? { t: 'The stitching is flawless!', pos: true } : q < 0.55 ? { t: 'The seams look a bit wobbly…', pos: false } : null;
    const lines = (stars >= 4 ? [...res.pos.map(t => ({ t, pos: true })), ...res.neg.map(t => ({ t, pos: false }))]
                              : [...res.neg.map(t => ({ t, pos: false })), ...res.pos.map(t => ({ t, pos: true }))]);
    if (seamNote) lines.splice(stars >= 4 ? 0 : 1, 0, seamNote);
    const shown = lines.slice(0, 4);
    const sad = stars <= 2;

    $app.innerHTML = `<div class="screen result">
      ${topbar()}
      <div class="result-top">${dressSVG(design)}<div class="avatar">${cu.avatar}</div></div>
      <div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(5 - stars)}</span></div>
      <div class="bubble" style="margin-top:4px"><b>${esc(cu.name)}:</b> “${reaction}” ${sad ? '😕' : stars >= 5 ? '😍' : '😊'}</div>
      <ul class="feedback">${shown.map(l => `<li class="${l.pos ? 'pos' : 'neg'}">${esc(l.t)}</li>`).join('')}</ul>
      <div class="pay">+💰${pay}${tip ? ` <span style="font-size:15px">(incl. 💰${tip} tip!)</span>` : ''}</div>
      <button class="primary" style="width:100%" data-act="next">${S.todayIdx >= CUSTOMERS_PER_DAY ? 'Close shop for the day' : 'Next customer →'}</button>
    </div>`;
    if (stars >= 4) { beep(784, .12); setTimeout(() => beep(1046, .18), 120); }
    const go = () => { if (S.todayIdx >= CUSTOMERS_PER_DAY) showDayEnd(); else showCustomer(); };
    $app.querySelector('[data-act="next"]').onclick = () => {
      if (!unlocked.length) return go();
      overlay(`<h2>Word is spreading! ⭐</h2><p>Your reputation now brings in new clients:</p>
        <ul>${unlocked.map(e => `<li><b>${esc(e.name)}</b></li>`).join('')}</ul>
        <p class="muted">Fancier events pay more. Check Supplies for the fabrics they'll want.</p>`, go);
    };
  }

    $app.innerHTML = `<div class="screen title-screen">
      <h1>Day ${S.day} complete!</h1>

  function showStore(back) {
    const draw = () => {
      $app.innerHTML = `<div class="screen store">
        ${topbar(`<button class="icon-btn" data-act="back">Done</button>`)}
        <h2>Supplies</h2>
        <p class="muted" style="margin:0">New fabrics and trims let you please pickier customers.</p>
        ${CATS.map(cat => {
          const forSale = Object.entries(cat.items).filter(([, it]) => it.price > 0);

          return `<h3>${cat.label}</h3><div class="store-list">${forSale.map(([id, it]) => {

            let sw = '';
            if (cat.key === 'col') sw = `<span class="swatch" style="background:${it.hex}"></span>`;
            else if (cat.key === 'pat') sw = `<span class="swatch">${swatchSVG(id, 'rose')}</span>`;
            return `<div class="store-item">${sw}<span class="name">${esc(it.name)}</span>
              ${owned ? '<span class="owned">Owned ✓</span>' : `<button data-buy="${cat.key}:${id}" ${S.money < it.price ? 'disabled' : ''}>💰${it.price}</button>`}</div>`;
          }).join('')}</div>`;
        }).join('')}
        <div style="height:8px"></div>
      </div>`;
      $app.querySelector('[data-act="back"]').onclick = back;
      $app.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
        const [cat, id] = b.dataset.buy.split(':');
        const it = item(cat, id);
        if (S.money < it.price || isOwned(cat, id)) return;
        S.money -= it.price; S.owned.push(cat + ':' + id); save();
        beep(988, .08); setTimeout(() => beep(1318, .12), 80);
        toast(`Bought ${it.name}!`);
        const y = $app.querySelector('.store').scrollTop;
        draw();
        $app.querySelector('.store').scrollTop = y;
      });
    };
    draw();
  }

  // ---------- Boot ----------
  showTitle();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
